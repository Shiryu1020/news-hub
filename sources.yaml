# ニュースソースの設定ファイル。
# 新しいAPIを追加するときは sources/ に1ファイル追加し、ここに登録するだけでよい。

sources:
  nasa_apod:
    enabled: false       # 不要なため無効化(sources/nasa.py は残置)
    module: sources.nasa
    api_key: DEMO_KEY

  stock:
    enabled: true
    module: sources.stock
    icon: "📈"
    tickers:
      - symbol: "^N225"
        label: "日経平均"
        news_query: "日経平均"
      - symbol: "^GSPC"
        label: "S&P500"
        news_query: "S&P500 株価"

  biz_strategy:
    enabled: true
    module: sources.rss
    label: "経営・戦略"
    icon: "💼"
    limit_per_feed: 5
    feeds:
      - http://feeds.hbr.org/harvardbusiness           # Harvard Business Review
      - https://www.mckinsey.com/insights/rss           # McKinsey Insights

  macro_geopolitics:
    enabled: true
    module: sources.rss
    label: "地政学・マクロ経済"
    icon: "🌍"
    limit_per_feed: 5
    feeds:
      - https://www.project-syndicate.org/rss           # Project Syndicate
      - https://www.foreignaffairs.com/rss.xml           # Foreign Affairs

  jp_business:
    enabled: true
    module: sources.rss
    label: "日本語ビジネスニュース"
    icon: "🗞️"
    limit_per_feed: 6
    feeds:
      - http://toyokeizai.net/list/feed/rss              # 東洋経済オンライン

  # 例: 追加予定のソース(未実装)
