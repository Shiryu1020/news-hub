# ニュースソースの設定ファイル。
# 新しいAPIを追加するときは sources/ に1ファイル追加し、ここに登録するだけでよい。

sources:
  nasa_apod:
    enabled: false       # 不要なため無効化(sources/nasa.py は残置)
    module: sources.nasa
    api_key: DEMO_KEY

  stock:
    enabled: true
    module: sources.stock
    icon: "📈"
    tickers:
      - symbol: "^N225"
        label: "日経平均"
        news_query: "日経平均"
      - symbol: "^GSPC"
        label: "S&P500"
        news_query: "S&P500 株価"

  # カテゴリ(label)は「トピック」軸で統一する。発行元(HBR/McKinsey等)は
  # カテゴリを分けず、feeds の name として記事ごとに表示する(MECEを保つため)。

  # HBR / Project Syndicate / Foreign Affairs は有料会員制(全文が読めない)ため未採用。
  # ここに登録するのは無料で全文読める(会員登録不要 or 無料登録のみ)ソースに限定する。

  biz_strategy:
    enabled: true
    module: sources.rss
    label: "経営・戦略"
    icon: "💼"
    limit_per_feed: 8
    feeds:
      - url: https://www.mckinsey.com/insights/rss
        name: "McKinsey Insights"

  macro_geopolitics:
    enabled: true
    module: sources.rss
    label: "地政学・マクロ経済"
    icon: "🌍"
    limit_per_feed: 8
    feeds:
      - url: https://www.aljazeera.com/xml/rss/all.xml
        name: "Al Jazeera"
      - url: https://cepr.org/rss/vox-content
        name: "VoxEU (CEPR)"

  jp_business:
    enabled: true
    module: sources.rss
    label: "国内ビジネス"
    icon: "🗞️"
    limit_per_feed: 6
    feeds:
      - url: http://toyokeizai.net/list/feed/rss
        name: "東洋経済オンライン"

